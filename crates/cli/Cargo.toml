[package]
name = "minesplit"
description = "minesplit command line: shielded-only addresses, statements, verification."
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
anyhow.workspace = true
serde_json.workspace = true
clap = { version = "4.5", features = ["derive"] }
zcash_address = "0.13.0"
zcash_protocol = "0.10.3"
minesplit-policy = { path = "../policy" }
minesplit-statement = { path = "../statement" }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { workspace = true }
rand = "0.8"
base64 = "0.22"
hex = { workspace = true }
sha2_hash = { package = "sha2", version = "0.10" }
